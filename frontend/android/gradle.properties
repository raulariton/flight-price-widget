org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Use JDK 21
org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-21.jdk/Contents/Home
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template.
# home_widget (0.10.0+) supports built-in Kotlin, but the transitive `jni`
# dependency (pulled in by widgetbook) doesn't declare KGP explicitly, which
# makes Flutter's compat shim force-apply kotlin-android onto it — and that
# fails once this flag removes KGP from the classpath. Keep this false until
# jni/widgetbook catch up.
android.builtInKotlin=false
# On first device run, this may be needed
# kotlin.incremental=false
